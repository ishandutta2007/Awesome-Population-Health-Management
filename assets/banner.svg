<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#06b6d4" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" filterUnits="userSpaceOnUse" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Paths -->
    <clipPath id="banner-clip">
      <rect x="0" y="0" width="1200" height="340" rx="16" ry="16" />
    </clipPath>
  </defs>

  <style>
    /* CSS Animations for Dynamic Aspects */
    @keyframes pulseLine {
      0% { stroke-dashoffset: 2000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }

    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes floatNodeReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.18); }
      30% { transform: scale(1); }
      45% { transform: scale(1.12); }
    }

    .ecg-line {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: pulseLine 4s linear infinite;
    }

    .pulse-ring {
      transform-origin: center;
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .pulse-ring-delayed {
      transform-origin: center;
      animation: pulseGlow 3s ease-in-out infinite 1.5s;
    }

    .node-float-1 {
      animation: floatNode 4s ease-in-out infinite;
    }

    .node-float-2 {
      animation: floatNodeReverse 5s ease-in-out infinite 0.5s;
    }

    .node-float-3 {
      animation: floatNode 4.5s ease-in-out infinite 1s;
    }

    .rotating-ring {
      transform-origin: 1040px 170px;
      animation: rotateRing 20s linear infinite;
    }

    .animated-heart {
      transform-origin: 110px 170px;
      animation: heartBeat 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
  </style>

  <g clip-path="url(#banner-clip)">
    <!-- Base Background -->
    <rect width="1200" height="340" fill="url(#bg-grad)" rx="16" />
    <rect width="1200" height="340" fill="url(#grid)" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="150" cy="170" r="180" fill="#06b6d4" opacity="0.12" />
    <circle cx="1050" cy="170" r="160" fill="#3b82f6" opacity="0.15" />
    <circle cx="600" cy="300" r="200" fill="#10b981" opacity="0.08" />

    <!-- Dynamic Glowing Pulse Rings (Left Icon Area) -->
    <circle cx="110" cy="170" r="75" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3" class="pulse-ring" />
    <circle cx="110" cy="170" r="60" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4" class="pulse-ring-delayed" />

    <!-- Left Emblem: Cross & Heartbeat Container -->
    <g class="node-float-1">
      <rect x="50" y="110" width="120" height="120" rx="24" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" filter="url(#glow-cyan)" />
      
      <!-- Medical Cross & Pulse Graphic -->
      <g class="animated-heart">
        <!-- Medical Cross Glow -->
        <path d="M 110 135 V 205 M 75 170 H 145" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" opacity="0.25" />
        <path d="M 110 135 V 205 M 75 170 H 145" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
        <!-- Heartbeat Pulse overlay inside cross -->
        <circle cx="110" cy="170" r="12" fill="#10b981" filter="url(#glow-cyan)" />
        <path d="M 92 170 Q 101 170 105 160 T 112 182 T 118 165 T 128 170" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Animated ECG Waveform running horizontally in background -->
    <path d="M 0 240 L 200 240 L 220 220 L 235 270 L 255 190 L 275 250 L 290 230 L 310 240 L 500 240 L 520 225 L 535 265 L 555 195 L 575 255 L 590 235 L 610 240 L 800 240 L 820 215 L 835 275 L 855 185 L 875 260 L 890 230 L 910 240 L 1200 240" fill="none" stroke="url(#pulse-grad)" stroke-width="2.5" opacity="0.4" />

    <path class="ecg-line" d="M 0 240 L 200 240 L 220 220 L 235 270 L 255 190 L 275 250 L 290 230 L 310 240 L 500 240 L 520 225 L 535 265 L 555 195 L 575 255 L 590 235 L 610 240 L 800 240 L 820 215 L 835 275 L 855 185 L 875 260 L 890 230 L 910 240 L 1200 240" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow-cyan)" />

    <!-- Center Content: Title & Badges -->
    <g transform="translate(210, 0)">
      <!-- Top Tag / Pill -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="280" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
        <circle cx="14" cy="14" r="5" fill="#10b981">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
        </circle>
        <text x="28" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED HEALTHCARE SUITES &amp; OS</text>
      </g>

      <!-- Main Title -->
      <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">
        Awesome Population Health Management
      </text>

      <!-- Subtitle -->
      <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
        Value-Based Care • Risk Stratification • Quality Analytics (HEDIS/MIPS) • FHIR Data Intelligence
      </text>

      <!-- Badges Row -->
      <g transform="translate(0, 185)">
        <!-- Badge 1: SaaS Platforms -->
        <g class="node-float-1">
          <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
          <circle cx="18" cy="17" r="4" fill="#3b82f6" />
          <text x="30" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Enterprise SaaS</text>
        </g>

        <!-- Badge 2: Open Source GitHub -->
        <g class="node-float-2" transform="translate(177, 0)">
          <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
          <circle cx="18" cy="17" r="4" fill="#10b981" />
          <text x="30" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Open-Source Code</text>
        </g>

        <!-- Badge 3: FHIR & Data Engines -->
        <g class="node-float-3" transform="translate(354, 0)">
          <rect x="0" y="0" width="185" height="34" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
          <circle cx="18" cy="17" r="4" fill="#06b6d4" />
          <text x="30" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">FHIR Interoperability</text>
        </g>
      </g>
    </g>

    <!-- Right Graphic: Interactive Population Network Diagram -->
    <g transform="translate(1040, 170)">
      <!-- Outer Rotating Tech Ring -->
      <circle class="rotating-ring" cx="0" cy="0" r="75" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
      <circle class="pulse-ring" cx="0" cy="0" r="55" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4" />

      <!-- Connected Population Nodes -->
      <!-- Central Hub Node -->
      <g class="node-float-1">
        <circle cx="0" cy="0" r="22" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
        <!-- Healthcare/People Icon inside central hub -->
        <path d="M -7 4 C -7 -1 -3 -5 0 -5 C 3 -5 7 -1 7 4 Z M 0 -7 A 4 4 0 1 0 0 -15 A 4 4 0 1 0 0 -7" fill="#38bdf8" />
      </g>

      <!-- Satellite Node 1: Analytics (Top Right) -->
      <g class="node-float-2" transform="translate(45, -40)">
        <line x1="-45" y1="40" x2="0" y2="0" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
        <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
        <path d="M -5 3 L -2 -2 L 1 1 L 5 -4" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Satellite Node 2: Patients/Care (Bottom Right) -->
      <g class="node-float-3" transform="translate(50, 35)">
        <line x1="-50" y1="-35" x2="0" y2="0" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
        <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
        <circle cx="0" cy="0" r="4" fill="#10b981" />
      </g>

      <!-- Satellite Node 3: Risk Stratification (Top Left) -->
      <g class="node-float-1" transform="translate(-45, -45)">
        <line x1="45" y1="45" x2="0" y2="0" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
        <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
        <circle cx="0" cy="0" r="3" fill="#3b82f6" />
      </g>

      <!-- Satellite Node 4: Quality Metrics (Bottom Left) -->
      <g class="node-float-2" transform="translate(-40, 45)">
        <line x1="40" y1="-45" x2="0" y2="0" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
        <circle cx="0" cy="0" r="13" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
        <path d="M -4 0 L -1 3 L 4 -3" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- Top Border Highlight Line -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent-grad)" />
  </g>
</svg>
